server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    # Long cache for hashed assets, no cache for index.html
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Reverse proxy API requests to the social service.
    # The frontend is configured at build time with VITE_API_BASE_URL=/api.
    location /api/ {
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The "social" service is reachable at this hostname inside docker-compose.
        proxy_pass http://social:3000/;
    }

    # SPA fallback — all unmatched routes go to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
