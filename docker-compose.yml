version: "3.9"
services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-football}
      POSTGRES_USER:     ${POSTGRES_USER:-football}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-football}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./api
    environment:
      DATABASE_URL:         postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET:           ${JWT_SECRET}
      PORT:                 3000
      STORAGE_ROOT:         /storage
      MAX_UPLOAD_BYTES:     ${MAX_UPLOAD_BYTES:-52428800}
      FILE_URL_TTL_SECONDS: ${FILE_URL_TTL_SECONDS:-600}
    volumes:
      - ./data/storage:/storage
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./web
      args:
        VITE_API_BASE_URL: /api
    ports:
      - "8080:80"
    depends_on:
      - api
    profiles: ["web"]

volumes:
  pg_data:
